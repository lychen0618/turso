services:
  proxy:
    image: lychen0618/lychen_only:turso-devcontainer-squid-dev
    networks: [sandbox, egress]
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3128"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 1s
  tursodb:
    depends_on:
      proxy:
        condition: service_healthy
    image: lychen0618/lychen_only:turso-devcontainer-tursodb-dev
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: "/home/node/.claude"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      HTTP_PROXY: "http://proxy:3128"
      HTTPS_PROXY: "http://proxy:3128"
      ALL_PROXY: "http://proxy:3128"
      NO_PROXY: "localhost,127.0.0.1"
    networks: [sandbox]
    volumes:
      - ..:/workspace:delegated
      # bind the main worktree, in case this is a linked worktree
      - ${MAIN_GIT_DIR:?run .devcontainer/init-env.sh to generate .devcontainer/.env}:${MAIN_GIT_DIR}:delegated
      - claude-code-bashhistory:/commandhistory
      - cargo-registry:/home/node/.cargo/registry
      - vscode-server:/home/node/.vscode-server

    cap_add:
      - NET_ADMIN
      - NET_RAW

    init: true
    tty: true

volumes:
  claude-code-bashhistory:
  claude-code-config:
  cargo-registry:
  vscode-server:
networks:
  sandbox:
    internal: true
  egress:
    driver: bridge
